version: '3.8'

services:
  hermes-api-test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=test
      - DATABASE_HOST=hermes-mariadb
      - DATABASE_PORT=3307
      - DATABASE_USER=appuser
      - DATABASE_PASSWORD=password
      - DATABASE_NAME=hermes_db
    depends_on:
      - hermes-mariadb
    volumes:
      - .:/app
      - /app/node_modules
    command: npm test

  hermes-mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: hermes_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data: